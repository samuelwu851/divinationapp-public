<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>笔记编辑器</title>
<style>
  /* 与 SwiftUI 界面保持一致：透明背景透出 App 的纸纹，系统字体，灰色圆角控件，系统强调色 */
  :root {
    color-scheme: light;
    --accent: #007aff;                       /* 由 Swift 注入系统强调色 */
    --fg: #1d1d1f;
    --secondary: rgba(60, 60, 67, 0.6);
    --fill: rgba(120, 120, 128, 0.12);       /* ≈ Color.gray.opacity(0.12) */
    --fill-strong: rgba(120, 120, 128, 0.18);/* ≈ 案主胶囊的 gray.opacity(0.18) */
    --stroke: rgba(60, 60, 67, 0.18);
    --card: rgba(255, 255, 255, 0.55);
    /* 文字色板：存 class 名，色值只在这里定义 */
    --c-red: #c62828; --c-orange: #e65100; --c-yellow: #a07800; --c-green: #2e7d32;
    --c-blue: #1565c0; --c-purple: #6a1b9a; --c-gray: #757575; --hl: #fff3a0;
    /* 五行色：与 WuXing.swift 一致 */
    --wx-wood: #34c759; --wx-fire: #ff3b30; --wx-earth: #8c5926; --wx-metal: #ffcc00; --wx-water: #007aff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; color: var(--fg);
    font: 18px/1.65 -apple-system, BlinkMacSystemFont, "PingFang SC", "PingFang TC", sans-serif; }
  body { padding: 0 20px 40px; }

  /* ---------- 工具栏 ---------- */
  .toolbar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 2px;
    padding: 6px 8px; margin: 0 -8px; border-radius: 10px; background: rgba(233, 231, 226, 0.92);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1px solid var(--stroke); }
  .toolbar button, .toolbar select { font: 15px -apple-system, "PingFang SC", sans-serif; color: var(--fg);
    background: none; border: 0; border-radius: 6px; padding: 4px 9px; cursor: default; min-width: 30px; height: 30px; }
  .toolbar button:hover, .toolbar select:hover { background: var(--fill); }
  .toolbar button.on { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .toolbar .sep { width: 1px; height: 18px; background: var(--stroke); margin: 0 4px; }
  .toolbar .group { display: none; align-items: center; gap: 2px; }
  .toolbar .group.show { display: flex; }
  .swatch-btn { display: inline-flex; align-items: center; gap: 4px; }
  .swatch-btn .bar { display: inline-block; width: 14px; height: 3px; border-radius: 2px; background: var(--fg); }
  .palette { position: absolute; top: 40px; display: none; gap: 6px; padding: 8px; border-radius: 10px; background: #fff;
    border: 1px solid var(--stroke); box-shadow: 0 4px 16px rgba(0,0,0,.12); z-index: 10; }
  .palette.show { display: flex; }
  .palette button { width: 22px; height: 22px; min-width: 0; padding: 0; border-radius: 50%; border: 1px solid var(--stroke); }
  .palette .clear { width: auto; border-radius: 6px; padding: 0 8px; font-size: 13px; }

  /* ---------- 正文 ---------- */
  .ProseMirror { outline: none; min-height: 60vh; padding-top: 14px; word-wrap: break-word; white-space: pre-wrap; }
  .ProseMirror > * + * { margin-top: 0.45em; }
  .ProseMirror p { margin: 0; }
  .ProseMirror h1 { font-size: 30px; margin: 0.6em 0 0.2em; line-height: 1.3; }
  .ProseMirror h2 { font-size: 24px; margin: 0.6em 0 0.2em; line-height: 1.35; }
  .ProseMirror h3 { font-size: 20px; margin: 0.5em 0 0.2em; line-height: 1.4; }
  .ProseMirror ul, .ProseMirror ol { padding-left: 1.4em; margin: 0.2em 0; }
  .ProseMirror li > p { margin: 0; }
  .ProseMirror blockquote { margin: 0.4em 0; padding-left: 12px; border-left: 3px solid var(--stroke); color: var(--secondary); }
  .ProseMirror hr { border: 0; border-top: 1px solid var(--stroke); margin: 1em 0; }
  .ProseMirror code { background: var(--fill); border-radius: 4px; padding: 0 4px; font-size: 0.9em; }
  .ProseMirror p.is-editor-empty:first-child::before { content: attr(data-placeholder); color: var(--secondary);
    float: left; height: 0; pointer-events: none; }
  .c-red { color: var(--c-red); } .c-orange { color: var(--c-orange); } .c-yellow { color: var(--c-yellow); }
  .c-green { color: var(--c-green); } .c-blue { color: var(--c-blue); } .c-purple { color: var(--c-purple); }
  .c-gray { color: var(--c-gray); }
  mark { background: var(--hl); color: inherit; border-radius: 2px; padding: 0 1px; }

  /* 表格 */
  .ProseMirror table { border-collapse: collapse; table-layout: fixed; width: 100%; margin: 0.4em 0; overflow: hidden; }
  .ProseMirror td, .ProseMirror th { border: 1px solid var(--stroke); padding: 4px 8px; vertical-align: top; position: relative; min-width: 40px; }
  .ProseMirror th { background: var(--fill); font-weight: 600; text-align: left; }
  .ProseMirror .selectedCell::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: color-mix(in srgb, var(--accent) 15%, transparent); }
  .ProseMirror .column-resize-handle { position: absolute; right: -2px; top: 0; bottom: 0; width: 4px; background: var(--accent); pointer-events: none; }
  .tableWrapper { overflow-x: auto; }
  .resize-cursor { cursor: col-resize; }

  /* ---------- 排盘卡片（整体，不可在里面打字） ---------- */
  .chart-card { position: relative; display: block; width: fit-content; margin: 6px auto; padding: 10px 16px 12px; min-width: 220px; max-width: 100%;
    background: var(--card); border: 1px solid var(--stroke); border-radius: 10px; cursor: pointer; user-select: none;
    -webkit-user-select: none; line-height: 1.3; }
  .chart-card:hover { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
  .ProseMirror-selectednode.chart-card { outline: 2px solid var(--accent); outline-offset: 1px; }
  .cc-head { font-size: 13px; color: var(--secondary); margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cc-head b { color: var(--fg); font-weight: 600; }
  .cc-del { position: absolute; top: -8px; right: -8px; width: 20px; height: 20px; border-radius: 50%; border: 0; padding: 0;
    background: #8e8e93; color: #fff; font-size: 13px; line-height: 20px; text-align: center; display: none; cursor: default; }
  .chart-card:hover .cc-del { display: block; }
  /* 八字：四柱，天干在上地支在下，五行上色（同 BaziPillarsView） */
  .bazi-pillars { display: flex; gap: 18px; }
  .pillar { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .pillar .lbl { font-size: 12px; color: var(--secondary); margin-bottom: 2px; }
  .pillar .gz { font-size: 28px; font-weight: 700; line-height: 1.15; }
  /* 易经 / 梅花：卦名 + 小卦图（同 MiniHexagram：阳爻一整条，阴爻两段） */
  .gua-pair { display: flex; align-items: center; gap: 18px; }
  .gua { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .gua .name { font-size: 17px; font-weight: 600; color: var(--fg); }
  .gua .lbl { font-size: 12px; color: var(--secondary); }
  .gua-arrow { font-size: 22px; color: var(--secondary); padding-bottom: 14px; }
  .mini-hex { display: flex; flex-direction: column; gap: 4px; }
  .yao { display: flex; align-items: center; gap: 6px; position: relative; }
  .yao span { display: block; height: 8px; border-radius: 2px; background: var(--fg); }
  .yao.yang span { width: 60px; }
  .yao.yin span { width: 27px; }
  .yao.moving::after { content: "→"; position: absolute; left: 66px; top: -7px; font-size: 13px; color: var(--fg); }
  .cc-missing { color: var(--secondary); font-size: 14px; }

  /* ---------- 图片（拖右下角圆点调大小） ---------- */
  .img-box { position: relative; display: block; max-width: 100%; margin: 4px 0; line-height: 0; }
  .img-box img { width: 100%; height: auto; border-radius: 6px; }
  .img-box .handle { position: absolute; right: -6px; bottom: -6px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); border: 2px solid #fff; cursor: nwse-resize; display: none; }
  .img-box:hover .handle, .ProseMirror-selectednode.img-box .handle { display: block; }
  .ProseMirror-selectednode.img-box img { outline: 2px solid var(--accent); outline-offset: 1px; }
  .img-box .size { position: absolute; left: 6px; top: 6px; font: 12px/1.4 -apple-system, sans-serif;
    background: rgba(0,0,0,.6); color: #fff; padding: 1px 6px; border-radius: 4px; display: none; }
  .img-box.resizing .size { display: block; }
  .img-box.broken { line-height: 1.4; padding: 12px; border: 1px dashed var(--stroke); border-radius: 6px; color: var(--secondary); font-size: 14px; }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: rgba(0,0,0,.75); color: #fff;
    font-size: 14px; padding: 6px 14px; border-radius: 8px; display: none; z-index: 20; }
  .toast.show { display: block; }
</style>
</head>
<body>
  <div class="toolbar" id="toolbar">
    <button data-cmd="bold" title="粗体 ⌘B"><b>B</b></button>
    <button data-cmd="italic" title="斜体 ⌘I"><i>I</i></button>
    <button data-cmd="underline" title="下划线 ⌘U"><u>U</u></button>
    <button data-cmd="strike" title="删除线 ⌘⇧S"><s>S</s></button>
    <span class="sep"></span>
    <select id="block-type" title="段落样式">
      <option value="p">正文</option>
      <option value="1">标题 1</option>
      <option value="2">标题 2</option>
      <option value="3">标题 3</option>
    </select>
    <span class="sep"></span>
    <button data-cmd="bulletList" title="项目符号列表 ⌘⇧8（或行首输入「- 空格」）">• 列表</button>
    <button data-cmd="orderedList" title="编号列表 ⌘⇧7（或行首输入「1. 空格」）">1. 编号</button>
    <span class="sep"></span>
    <span style="position:relative">
      <button id="color-btn" class="swatch-btn" title="文字颜色">A<span class="bar" id="color-bar"></span></button>
      <div class="palette" id="palette"></div>
    </span>
    <button data-cmd="highlight" title="高亮 ⌘⇧H"><mark>高亮</mark></button>
    <span class="sep"></span>
    <button id="table-btn" title="插入表格">表格</button>
    <button id="image-btn" title="插入图片（也可以直接拖入或粘贴）">图片</button>
    <span class="group" id="table-group">
      <span class="sep"></span>
      <button data-table="addRowAfter" title="在下方加一行">+行</button>
      <button data-table="addColumnAfter" title="在右侧加一列">+列</button>
      <button data-table="deleteRow" title="删除这一行">−行</button>
      <button data-table="deleteColumn" title="删除这一列">−列</button>
      <button data-table="deleteTable" title="删除整个表格">删表</button>
    </span>
  </div>
  <div id="editor"></div>
  <input type="file" id="file-input" accept="image/*" multiple hidden>
  <div class="toast" id="toast"></div>
  <script type="module" src="note-editor.mjs"></script>
</body>
</html>
