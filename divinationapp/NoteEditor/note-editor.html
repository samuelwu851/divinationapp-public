<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>笔记编辑器</title>
<style>
  /* 与 SwiftUI 界面保持一致：透明背景透出 App 的纸纹，系统字体，灰色圆角控件，系统强调色 */
  :root {
    color-scheme: light;
    --accent: #007aff;                       /* 由 Swift 注入系统强调色 */
    --fg: #1d1d1f;
    --secondary: rgba(60, 60, 67, 0.6);
    --fill: rgba(120, 120, 128, 0.12);       /* ≈ Color.gray.opacity(0.12) */
    --fill-strong: rgba(120, 120, 128, 0.18);/* ≈ 案主胶囊的 gray.opacity(0.18) */
    --stroke: rgba(60, 60, 67, 0.18);
    --card: rgba(255, 255, 255, 0.55);
    /* 文字色板：存 class 名，色值只在这里定义 */
    --c-red: #c62828; --c-orange: #e65100; --c-yellow: #a07800; --c-green: #2e7d32;
    --c-blue: #1565c0; --c-purple: #6a1b9a; --c-gray: #757575; --hl: #fff3a0;
    /* 五行色：与 WuXing.swift 一致 */
    --wx-wood: #34c759; --wx-fire: #ff3b30; --wx-earth: #8c5926; --wx-metal: #ffcc00; --wx-water: #007aff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; color: var(--fg);
    font: 18px/1.65 -apple-system, BlinkMacSystemFont, "PingFang SC", "PingFang TC", sans-serif; }
  body { padding: 0 20px 40px; }

  /* ---------- 工具栏 ---------- */
  .toolbar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 0;
    padding: 6px 6px; margin: 0 -8px; border-radius: 10px; background: rgba(233, 231, 226, 0.92);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1px solid var(--stroke); }
  .toolbar button, .toolbar select { font: 15px -apple-system, "PingFang SC", sans-serif; color: var(--fg);
    background: none; border: 0; border-radius: 6px; padding: 4px 5px; cursor: default; min-width: 28px; height: 30px;
    white-space: nowrap; }
  .toolbar button:hover, .toolbar select:hover { background: var(--fill); }
  .toolbar button.on { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .toolbar .sep { width: 1px; height: 18px; background: var(--stroke); margin: 0 2px; }
  /* 默认窗口宽度（518）下整条工具栏要放进一行：下拉框定宽，按钮内边距收紧 */
  #block-type { width: 62px; }
  #table-ops { width: 58px; }
  .swatch-btn { display: inline-flex; align-items: center; gap: 4px; }
  .swatch-btn .bar { display: inline-block; width: 14px; height: 3px; border-radius: 2px; background: var(--fg); }
  .palette { position: absolute; top: 40px; right: 0; display: none; align-items: center; gap: 6px; padding: 8px;
    white-space: nowrap; border-radius: 10px; background: #fff;
    border: 1px solid var(--stroke); box-shadow: 0 4px 16px rgba(0,0,0,.12); z-index: 10; }
  .palette.show { display: flex; }
  .palette button { width: 22px; height: 22px; min-width: 0; padding: 0; border-radius: 50%; border: 1px solid var(--stroke); flex-shrink: 0; }
  .palette .clear { width: auto; height: 24px; border-radius: 6px; padding: 0 10px; font-size: 13px; margin-left: 4px; }

  /* ---------- 正文 ---------- */
  .ProseMirror { outline: none; min-height: 60vh; padding-top: 14px; word-wrap: break-word; white-space: pre-wrap; }
  .ProseMirror > * + * { margin-top: 0.45em; }
  .ProseMirror p { margin: 0; }
  .ProseMirror h1 { font-size: 30px; margin: 0.6em 0 0.2em; line-height: 1.3; }
  .ProseMirror h2 { font-size: 24px; margin: 0.6em 0 0.2em; line-height: 1.35; }
  .ProseMirror h3 { font-size: 20px; margin: 0.5em 0 0.2em; line-height: 1.4; }
  .ProseMirror ul, .ProseMirror ol { padding-left: 1.4em; margin: 0.2em 0; }
  .ProseMirror li > p { margin: 0; }
  .ProseMirror blockquote { margin: 0.4em 0; padding-left: 12px; border-left: 3px solid var(--stroke); color: var(--secondary); }
  .ProseMirror hr { border: 0; border-top: 1px solid var(--stroke); margin: 1em 0; }
  .ProseMirror code { background: var(--fill); border-radius: 4px; padding: 0 4px; font-size: 0.9em; }
  .ProseMirror p.is-editor-empty:first-child::before { content: attr(data-placeholder); color: var(--secondary);
    float: left; height: 0; pointer-events: none; }
  .c-red { color: var(--c-red); } .c-orange { color: var(--c-orange); } .c-yellow { color: var(--c-yellow); }
  .c-green { color: var(--c-green); } .c-blue { color: var(--c-blue); } .c-purple { color: var(--c-purple); }
  .c-gray { color: var(--c-gray); }
  mark { background: var(--hl); color: inherit; border-radius: 2px; padding: 0 1px; }

  /* 表格 */
  .ProseMirror table { border-collapse: collapse; table-layout: fixed; width: 100%; margin: 0.4em 0; overflow: hidden; }
  .ProseMirror td, .ProseMirror th { border: 1px solid var(--stroke); padding: 4px 8px; vertical-align: top; position: relative; min-width: 40px; }
  .ProseMirror th { background: var(--fill); font-weight: 600; text-align: left; }
  .ProseMirror .selectedCell::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: color-mix(in srgb, var(--accent) 15%, transparent); }
  .ProseMirror .column-resize-handle { position: absolute; right: -2px; top: 0; bottom: 0; width: 4px; background: var(--accent); pointer-events: none; }
  .tableWrapper { overflow-x: auto; }
  .resize-cursor { cursor: col-resize; }

  /* ---------- 排盘卡片（整体，不可在里面打字） ---------- */
  .chart-wrap { display: flex; justify-content: center; margin: 6px 0; }
  .chart-anchor { position: relative; max-width: 100%; }
  .chart-card { position: relative; display: block; width: fit-content; margin: 0; padding: 10px 16px 12px; min-width: 220px; max-width: 100%;
    background: var(--card); border: 1px solid var(--stroke); border-radius: 10px; cursor: pointer; user-select: none;
    -webkit-user-select: none; line-height: 1.3; }
  .chart-card:hover { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
  .ProseMirror-selectednode .chart-card { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* 排盘标签：挂在卡片右侧（absolute，卡片仍然居中） */
  .chart-labels { position: absolute; left: calc(100% + 10px); top: 2px; display: flex; flex-direction: column;
    align-items: flex-start; gap: 5px; width: max-content; max-width: 110px; line-height: 1.3; }
  /* 标签多了：这一栏最高 150，超过就竖向滚动（滚动条一直显示）；上、右留空给 × */
  .cl-chips { display: flex; flex-direction: column; align-items: flex-start; gap: 5px;
    max-height: 150px; overflow-y: auto; padding: 7px 7px 2px 0; margin: -7px -7px 0 0; }
  .cl-chip { position: relative; display: inline-flex; max-width: 100px; font-size: 13px; padding: 2px 9px;
    border-radius: 10px; background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); flex-shrink: 0; }
  .cl-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }    /* 太长 → 后面省略号 */
  /* 常显的细滚动条（WebKit 默认只在滚动时显示） */
  .cl-chips::-webkit-scrollbar, .cl-list::-webkit-scrollbar { width: 6px; }
  .cl-chips::-webkit-scrollbar-thumb, .cl-list::-webkit-scrollbar-thumb { background: rgba(60,60,67,.3); border-radius: 3px; }
  .cl-chips::-webkit-scrollbar-track, .cl-list::-webkit-scrollbar-track { background: transparent; }
  .cl-x { position: absolute; top: -7px; right: -7px; width: 16px; height: 16px; padding: 0; border: 0; border-radius: 50%;
    background: #8e8e93; color: #fff; font-size: 11px; line-height: 16px; text-align: center; display: none; }
  .cl-chip:hover .cl-x { display: block; }
  .cl-add { font: 12px -apple-system, "PingFang SC", sans-serif; color: var(--secondary); background: none;
    border: 1px dashed var(--stroke); border-radius: 10px; padding: 1px 8px; visibility: hidden; }
  .chart-wrap:hover .cl-add, .chart-labels.open .cl-add { visibility: visible; }
  .cl-pop { position: absolute; top: 100%; right: 0; margin-top: 4px; width: 200px; padding: 8px; z-index: 10;
    background: #fff; border: 1px solid var(--stroke); border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.12); }
  .cl-pop input { width: 100%; font: 14px -apple-system, "PingFang SC", sans-serif; padding: 4px 8px;
    border: 1px solid var(--stroke); border-radius: 6px; outline: none; }
  .cl-pop input:focus { border-color: var(--accent); }
  .cl-list { display: flex; flex-direction: column; max-height: 180px; overflow-y: auto; margin-top: 4px; }
  .cl-item { text-align: left; font: 14px -apple-system, "PingFang SC", sans-serif; color: var(--fg); background: none;
    border: 0; border-radius: 6px; padding: 4px 8px; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cl-item:hover { background: var(--fill); }
  .cl-row { display: flex; align-items: center; border-radius: 6px; }
  .cl-row:hover { background: var(--fill); }
  .cl-row .cl-item { flex: 1; }
  .cl-row .cl-item:hover { background: none; }
  .cl-del { border: 0; background: none; color: var(--secondary); font-size: 14px; padding: 2px 8px; border-radius: 6px; }
  .cl-del:hover { color: #ff3b30; }
  .cl-new { color: var(--accent); }
  .cc-head { font-size: 13px; color: var(--secondary); margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cc-head b { color: var(--fg); font-weight: 600; }
  .cc-del { position: absolute; top: -8px; right: -8px; width: 20px; height: 20px; border-radius: 50%; border: 0; padding: 0;
    background: #8e8e93; color: #fff; font-size: 13px; line-height: 20px; text-align: center; display: none; cursor: default; }
  .chart-card:hover .cc-del { display: block; }
  /* 八字：四柱，天干在上地支在下，五行上色（同 BaziPillarsView） */
  .bazi-pillars { display: flex; justify-content: center; gap: 18px; }   /* 标题行比四柱宽时，四柱在卡片里居中 */
  .pillar { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .pillar .lbl { font-size: 12px; color: var(--secondary); margin-bottom: 2px; }
  .pillar .gz { font-size: 28px; font-weight: 700; line-height: 1.15; }
  /* 易经 / 梅花：卦名 + 小卦图（同 MiniHexagram：阳爻一整条，阴爻两段） */
  .gua-pair { display: flex; justify-content: center; align-items: center; gap: 30px; }   /* 30：给本卦动爻旁的 → 留位置 */   /* 标题行比卦象宽时，卦象在卡片里居中 */
  .gua-row { display: flex; justify-content: center; align-items: flex-start; gap: 18px; }   /* 通用卡片：一排卦，无动爻 */
  .gua { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .gua .name { font-size: 17px; font-weight: 600; color: var(--fg); }
  .gua .lbl { font-size: 12px; color: var(--secondary); }
  .mini-hex { display: flex; flex-direction: column; gap: 4px; }
  .yao { display: flex; align-items: center; gap: 6px; position: relative; }
  .yao span { display: block; height: 8px; border-radius: 2px; background: var(--fg); }
  .yao.yang span { width: 60px; }
  .yao.yin span { width: 27px; }
  /* 五行颜色（body.wx-on 时生效）：传统五色调柔和，和 Swift 的 GuaWuXingColor 一致；金用灰白加细灰边 */
  .wx-on .yao[data-wx="木"] span { background: #6e9873; }
  .wx-on .yao[data-wx="火"] span { background: #b45a50; }
  .wx-on .yao[data-wx="土"] span { background: #c4a24f; }
  .wx-on .yao[data-wx="金"] span { background: #eeebe5; box-shadow: inset 0 0 0 1px #aca89f; }
  .wx-on .yao[data-wx="水"] span { background: #33363a; }
  .yao.moving::after { content: "→"; position: absolute; left: 66px; top: -7px; font-size: 13px; color: var(--fg); }
  .cc-missing { color: var(--secondary); font-size: 14px; }

  /* ---------- 图片（拖右下角圆点调大小） ---------- */
  /* 正文最多 760 宽、居中：窗口很宽时一行字不会太长（工具栏跟着对齐） */
  #editor, .toolbar { max-width: 760px; margin-left: auto; margin-right: auto; }
  /* 图片：宽度是像素（窗口变宽不跟着放大）；窗口比图窄时缩到放得下；不超过原图像素宽度（JS 里设 max-width） */
  .img-box { position: relative; display: block; max-width: 100%; margin: 4px 0; line-height: 0; }
  .img-box[data-align="center"] { margin-left: auto; margin-right: auto; }
  .img-box[data-align="right"] { margin-left: auto; margin-right: 0; }
  /* 裁剪：框外压暗，框可拖动；四角四边有把手（放在框里面：裁剪时图片外面会被裁掉，伸出去就点不到了） */
  .img-box.cropping { overflow: hidden; outline: 2px solid var(--accent); }
  .crop-rect { position: absolute; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); outline: 1px solid #fff; cursor: move; }
  .crop-rect .ch { position: absolute; width: 12px; height: 12px; background: #fff; border: 1px solid #888; border-radius: 2px; }
  .crop-rect .ch[data-h="nw"] { left: 0; top: 0; cursor: nwse-resize; }
  .crop-rect .ch[data-h="ne"] { right: 0; top: 0; cursor: nesw-resize; }
  .crop-rect .ch[data-h="sw"] { left: 0; bottom: 0; cursor: nesw-resize; }
  .crop-rect .ch[data-h="se"] { right: 0; bottom: 0; cursor: nwse-resize; }
  .crop-rect .ch[data-h="n"] { left: calc(50% - 6px); top: 0; cursor: ns-resize; }
  .crop-rect .ch[data-h="s"] { left: calc(50% - 6px); bottom: 0; cursor: ns-resize; }
  .crop-rect .ch[data-h="w"] { left: 0; top: calc(50% - 6px); cursor: ew-resize; }
  .crop-rect .ch[data-h="e"] { right: 0; top: calc(50% - 6px); cursor: ew-resize; }
  .crop-bar { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 6px; line-height: 1.4; z-index: 3; }
  .crop-bar button { font: 13px -apple-system, "PingFang SC", sans-serif; padding: 3px 10px; border-radius: 6px;
    border: 1px solid rgba(0,0,0,.2); background: #fff; color: #222; cursor: pointer; }
  .crop-bar button.ok { background: var(--accent); color: #fff; border-color: transparent; }
  .img-box img { width: 100%; height: auto; border-radius: 6px; }
  .img-box .handle { position: absolute; right: -6px; bottom: -6px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); border: 2px solid #fff; cursor: nwse-resize; display: none; }
  .img-box:hover .handle, .ProseMirror-selectednode.img-box .handle { display: block; }
  .ProseMirror-selectednode.img-box img { outline: 2px solid var(--accent); outline-offset: 1px; }
  .img-box .size { position: absolute; left: 6px; top: 6px; font: 12px/1.4 -apple-system, sans-serif;
    background: rgba(0,0,0,.6); color: #fff; padding: 1px 6px; border-radius: 4px; display: none; }
  .img-box.resizing .size { display: block; }
  .img-box.broken { line-height: 1.4; padding: 12px; border: 1px dashed var(--stroke); border-radius: 6px; color: var(--secondary); font-size: 14px; }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: rgba(0,0,0,.75); color: #fff;
    font-size: 14px; padding: 6px 14px; border-radius: 8px; display: none; z-index: 20; }
  .toast.show { display: block; }
</style>
</head>
<body>
  <!-- 页面顶上留给宿主的标题 / 案主 / 标签 / 术数（它们是 SwiftUI，盖在这块空白上，跟着页面一起滚走）；
       高度由宿主 noteEditor.setTopInset() 设定。滚过这块以后，工具栏 sticky 停在最上面。 -->
  <div id="top-inset"></div>
  <div class="toolbar" id="toolbar">
    <button data-cmd="bold" title="粗体 ⌘B"><b>B</b></button>
    <button data-cmd="italic" title="斜体 ⌘I"><i>I</i></button>
    <button data-cmd="underline" title="下划线 ⌘U"><u>U</u></button>
    <button data-cmd="strike" title="删除线 ⌘⇧S"><s>S</s></button>
    <span class="sep"></span>
    <select id="block-type" title="段落样式">
      <option value="p">正文</option>
      <option value="1">标题 1</option>
      <option value="2">标题 2</option>
      <option value="3">标题 3</option>
    </select>
    <span class="sep"></span>
    <button data-cmd="bulletList" title="项目符号列表 ⌘⇧8（或行首输入「- 空格」）">•列表</button>
    <button data-cmd="orderedList" title="编号列表 ⌘⇧7（或行首输入「1. 空格」）">1.编号</button>
    <span class="sep"></span>
    <span style="position:relative">
      <button id="color-btn" class="swatch-btn" title="文字颜色">A<span class="bar" id="color-bar"></span></button>
      <div class="palette" id="palette"></div>
    </span>
    <button data-cmd="highlight" title="高亮 ⌘⇧H"><mark>高亮</mark></button>
    <span class="sep"></span>
    <button id="table-btn" title="插入表格">表格</button>
    <!-- 光标在表格里时，替换上面的「表格」按钮：表格操作收进下拉菜单，工具栏保持一行 -->
    <select id="table-ops" title="表格操作" hidden>
      <option value="" selected>表格</option>
      <option value="addRowBefore">在上方加一行</option>
      <option value="addRowAfter">在下方加一行</option>
      <option value="addColumnBefore">在左侧加一列</option>
      <option value="addColumnAfter">在右侧加一列</option>
      <option value="deleteRow">删除这一行</option>
      <option value="deleteColumn">删除这一列</option>
      <option value="deleteTable">删除整个表格</option>
    </select>
    <button id="image-btn" title="插入图片（也可以直接拖入或粘贴）">图片</button>
  </div>
  <div id="editor"></div>
  <input type="file" id="file-input" accept="image/*" multiple hidden>
  <div class="toast" id="toast"></div>
  <script type="module" src="note-editor.mjs"></script>
</body>
</html>
